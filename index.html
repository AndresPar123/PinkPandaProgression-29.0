<script>
const starter = [
["Bench press","Borst"],["Incline dumbbell press","Borst"],["Chest fly","Borst"],["Lat pulldown","Rug"],["Seated cable row","Rug"],["Barbell row","Rug"],["Pull-up","Rug"],["Shoulder press","Schouders"],["Lateral raise","Schouders"],["Bicep curl","Biceps"],["Hammer curl","Biceps"],["Triceps pushdown","Triceps"],["Squat","Benen"],["Leg press","Benen"],["Romanian deadlift","Benen"],["Leg curl","Benen"],["Leg extension","Benen"],["Calf raise","Benen"],["Hip thrust","Billen"],["Plank","Buik"]
];
const KEY="gymprogress_v1";
let data;
try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){data=null}
if(!data)data={exercises:starter.map((x,i)=>({id:"e"+i,name:x[0],group:x[1]})),sessions:[]};

// Neue Spielgegevens worden toegevoegd zonder bestaande trainingen of notities te wissen.

if(!Array.isArray(data.ownedPandas))data.ownedPandas=["power"];
if(!data.ownedPandas.includes("power"))data.ownedPandas.unshift("power");

if(!data.ownedPandas.includes(data.activePanda))data.activePanda="power";
let selectedId=data.exercises[0]?.id||null, draft=[], detailOpen=false, editingSessionId=null, editingSessionDate=null;
const DRAFT_STORAGE_KEY="pinkpanda_unsaved_workout_drafts_v1";
function readWorkoutDrafts(){try{return JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY)||"{}")}catch{return {}}}
function storeWorkoutDraft(){if(!selectedId||editingSessionId)return;try{const all=readWorkoutDrafts();all[selectedId]={sets:draft.map(s=>({kg:String(s.kg??""),reps:String(s.reps??"")})),date:$('sessionDate')?.value||new Date().toLocaleDateString('en-CA')};localStorage.setItem(DRAFT_STORAGE_KEY,JSON.stringify(all))}catch{}}

function makeBackupFile(){
 try{
  const createdAt=new Date().toISOString();localStorage.setItem(LAST_BACKUP_KEY,createdAt);
  const entries=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key!==null)entries.push([key,localStorage.getItem(key)]);}
  const backup={format:'PinkPandaProgression-backup',version:1,createdAt,entries};
  const blob=new Blob([JSON.stringify(backup)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PinkPandaProgression_backup_'+createdAt.slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);

function restoreBackupFile(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{
  try{
   const backup=JSON.parse(String(reader.result||''));
   if(!backup||backup.format!=='PinkPandaProgression-backup'||backup.version!==1||!Array.isArray(backup.entries)||!backup.entries.every(item=>Array.isArray(item)&&item.length===2&&typeof item[0]==='string'&&(typeof item[1]==='string'||item[1]===null)))throw new Error('invalid backup');
   if(!confirm('Weet je zeker dat je deze back-up wilt terugzetten? Alle huidige gegevens in deze browser worden vervangen door de gegevens uit het back-upbestand. Maak eventueel eerst een back-up van de huidige gegevens.')){event.target.value='';return;}
   localStorage.clear();for(const [key,value] of backup.entries){if(value!==null)localStorage.setItem(key,value);}
   if(backup.createdAt)localStorage.setItem(LAST_BACKUP_KEY,backup.createdAt);
   alert('Back-up teruggezet. De app wordt opnieuw geladen.');window.location.reload();
  }catch(err){alert('Dit bestand lijkt geen geldige PinkPandaProgression-back-up te zijn. Je huidige gegevens zijn niet aangepast.');event.target.value='';}
 };reader.onerror=()=>{alert('Het back-upbestand kon niet worden gelezen.');event.target.value='';};reader.readAsText(file);
}

 $("deleteExercise").onclick=()=>{if(confirm(`Oefening "${e.name}" en de bijbehorende geschiedenis verwijderen?`)){data.exercises=data.exercises.filter(x=>x.id!==e.id);data.sessions=data.sessions.filter(s=>s.exerciseId!==e.id);selectedId=data.exercises[0]?.id||null;draft=[];detailOpen=false;$("appLayout").classList.remove("detail-mode");persist();updateCoins();renderList();renderWorkout()}};

 $("clearSets").onclick=()=>{draft=[{kg:"",reps:""},{kg:"",reps:""},{kg:"",reps:""}];storeWorkoutDraft();renderWorkout()};

 $("saveSession").onclick=()=>{
   const sets=draft.map(s=>({kg:String(s.kg).trim(),reps:String(s.reps).trim()}));
   if(sets.some(s=>s.kg===""||s.reps==="")){$("toast").textContent="Vul voor elke set zowel gewicht als reps in.";return}
   if(sets.some(s=>Number(s.kg)<0||Number(s.reps)<0||!Number.isFinite(Number(s.kg))||!Number.isFinite(Number(s.reps)))){$("toast").textContent="Gebruik geldige, positieve getallen.";return}
   const date=$("sessionDate").value;if(!date){$("toast").textContent="Kies een datum.";return}
   if(editingSessionId){const index=data.sessions.findIndex(s=>s.savedAt===editingSessionId&&s.exerciseId===e.id);if(index<0){$("toast").textContent="Deze training kan niet meer worden bewerkt.";editingSessionId=null;editingSessionDate=null;return}data.sessions[index]={...data.sessions[index],date,sets};data.calendarHiddenWorkoutDates=(data.calendarHiddenWorkoutDates||[]).filter(d=>d!==date);persist();clearWorkoutDraft(e.id);editingSessionId=null;editingSessionDate=null;draft=[];renderWorkout();renderList();const toast=$("toast");if(toast)toast.textContent="✓ Laatste training aangepast.";}else{data.sessions.push({exerciseId:e.id,date,sets,savedAt:Date.now()});data.calendarHiddenWorkoutDates=(data.calendarHiddenWorkoutDates||[]).filter(d=>d!==date);data.coins=(Number(data.coins)||0)+1;persist();clearWorkoutDraft(e.id);updateCoins();renderShop();draft=[];renderWorkout();renderMotivator();const toast=$("toast");if(toast)toast.textContent="🐼 +1 muntje verdiend! Goed bezig!";}
 };
}
$("search").addEventListener("input",renderList);
$("addExercise").onclick=()=>{const name=$("newExercise").value.trim();if(!name){$("newExercise").focus();return}if(data.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){alert("Deze oefening bestaat al.");return}const e={id:"e"+Date.now(),name,group:$("newGroup").value};data.exercises.push(e);selectedId=e.id;draft=[];detailOpen=true;$("appLayout").classList.add("detail-mode");$("newExercise").value="";$("search").value="";persist();renderList();renderWorkout();switchTab("exercises")};
